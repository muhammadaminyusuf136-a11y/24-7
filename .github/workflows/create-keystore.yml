# Play Market imzo kalitini GitHub serverida yaratish (kompyuterga Java o'rnatmasdan).
# Faqat qo'lda ishga tushiriladi: Actions → "Imzo kalitini yaratish" → Run workflow.
# DIQQAT: faqat PRIVATE (yopiq) repozitoriyada ishlating. Kalit artefakti 1 kundan keyin o'chadi —
# darhol yuklab oling va xavfsiz joyda (masalan, parol menejeri yoki shaxsiy disk) saqlang.

name: Imzo kalitini yaratish

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Kalit paroli (kamida 8 belgi, eslab qoling!)"
        required: true
        type: string

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Parolni yashirish va tekshirish
        env:
          PASS: ${{ inputs.password }}
        run: |
          echo "::add-mask::$PASS"
          if [ ${#PASS} -lt 8 ]; then echo "Parol kamida 8 belgi bo'lishi kerak"; exit 1; fi

      - name: Kalit yaratish
        env:
          PASS: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v \
            -keystore reja24-release.jks \
            -alias reja24 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=24/7Reja, O=24/7Reja, C=UZ"
          base64 -w 0 reja24-release.jks > KEYSTORE_BASE64.txt

      - name: Kalitni yuklash (1 kun saqlanadi)
        uses: actions/upload-artifact@v4
        with:
          name: reja24-imzo-kaliti
          path: |
            reja24-release.jks
            KEYSTORE_BASE64.txt
          retention-days: 1
