# 24/7Reja — avtomatik yig'ish (GitHub Actions)
#
# Har safar kod GitHub'ga yuklanganda:
#   1) debug APK yig'iladi va "Artifacts" bo'limiga qo'yiladi (telefonga o'rnatib sinash uchun)
#   2) unit testlar ishga tushadi, hisobot ham yuklanadi
#
# "v1.0.0" kabi teg qo'yilganda (va Secrets sozlangan bo'lsa) Play Market uchun
# imzolangan AAB ham yig'iladi.

name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK + testlar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle sozlash (kesh bilan)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew'ga ishga tushirish huquqi
        run: chmod +x gradlew

      - name: Debug APK yig'ish
        run: ./gradlew assembleDebug --stacktrace

      - name: APK ni yuklash (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 24-7Reja-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit testlar
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Test hisobotini yuklash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hisoboti
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Play Market uchun AAB (faqat v* teglarida)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Imzo kalitini tiklash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret topilmadi — README dagi 'Play Market' bo'limini bajaring."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Imzolangan AAB va APK yig'ish
        env:
          REJA_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          REJA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REJA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          REJA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: AAB va APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: 24-7Reja-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
